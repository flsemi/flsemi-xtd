[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flsemi"
version = "0.5.0"
description = "Local tools for FLSEMI devices — dashboard, configuration and firmware update over USB or Bluetooth LE. The device on the port says what it is."
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.9"
authors = [
  {name = "FL Semiconductor LLC", email = "hello@flsemi.us"},
  {name = "BANFi Semiconductor Co., Ltd."},
]
keywords = ["DECT NR+", "DECT-2020", "EnOcean", "nRF9151", "nRF5340", "Thingy:91 X", "EdgeBox", "mesh", "SMP", "mcumgr"]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: System :: Hardware",
  "Intended Audience :: Developers",
]
dependencies = ["pyserial>=3.5", "cbor2>=5.4", "bleak>=0.21"]

[project.urls]
Homepage = "https://flsemi.us"
Source = "https://github.com/flsemi/flsemi-xtd"

[project.scripts]
flsemi = "flsemi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
